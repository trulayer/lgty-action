name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default: the PR gate only ever needs to read the repo.
# The release job (release.yml) is the only workflow that gets write scope.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pin the exact multi-platform image index: integration semantics are
        # part of the public action's trust boundary, so CI must not float.
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20 # 16.14
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # Both the collector integration test and LGT-34's full orchestration
      # test must RUN in every PR gate, never silently skip.
      LGTY_TEST_DB_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: gofmt
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && echo "run: make fmt" && exit 1)

      - name: vet
        run: go vet ./...

      # go.sum is committed (pgx landed in LGT-34). These two steps make an
      # unpinned/tampered/floating dependency a hard CI failure rather than a
      # reviewer's manual catch.
      - name: go mod verify
        run: go mod verify
        env:
          GOFLAGS: -mod=readonly

      - name: go mod tidy drift check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: build
        run: go build ./...
        env:
          GOFLAGS: -mod=readonly

      - name: test
        run: go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...
        env:
          GOFLAGS: -mod=readonly

      - name: test (race)
        run: go test -race -count=1 ./...
        env:
          GOFLAGS: -mod=readonly

      # Informational only (LGT-220): never gates a merge. `fail_ci_if_error`
      # is left at its default (false) and the step is continue-on-error, so a
      # Codecov outage can't block an unrelated PR on this public repo.
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        continue-on-error: true
        with:
          use_oidc: true
          slug: trulayer/lgty-action
          files: ./coverage.out

      # Go's own vulnerability scanner: call-graph-aware, so it only flags
      # vulnerabilities actually reachable from this code — high signal, low
      # noise for a small CLI. Version pinned deliberately; bump in a
      # reviewed PR, not via @latest.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:bdf7013b2c3634a487671158da77c554f531742326b543a9464d2adf6c433ac8 # 1.171.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scoped to the real risk surface for this binary: injection/taint into
      # the DSN and the guarded query path, OS/exec misuse, and an
      # accidentally committed credential — not the full rule registry.
      # Blocking on ERROR severity.
      - name: semgrep (blocking, ERROR severity)
        run: semgrep scan --config p/golang --config p/gosec --config p/secrets --severity ERROR --error

      # WARNING+ findings are surfaced in the log but never fail the build.
      - name: semgrep (advisory, WARNING+ severity)
        if: always()
        continue-on-error: true
        run: semgrep scan --config p/golang --config p/gosec --config p/secrets --severity WARNING --severity ERROR

  # Stable umbrella context for branch protection. `if: always()` makes this
  # run even when an upstream job fails, while the explicit result checks keep
  # cancellation, failure, or a skipped security/build job fail-closed.
  ci:
    if: always()
    needs: [build, semgrep]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every blocking CI job
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$SEMGREP_RESULT" = success
