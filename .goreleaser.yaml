# GoReleaser config for lgty-action's signed, checksummed, SBOM'd release.
# Driven by .github/workflows/release.yml on every `v*` tag push.
#
# Orchestration choice: GoReleaser over hand-wired YAML, per security-c's
# LGT-37 recommendation — it does the cross-compile matrix, -trimpath,
# SOURCE_DATE_EPOCH honoring, checksums, cosign signing, and SBOM generation
# as first-class phases instead of bespoke shell steps.
version: 2

project_name: lgty-action

before:
  hooks:
    # Defense in depth on the release path itself, not just the PR gate.
    - go mod verify

builds:
  - id: lgty-action
    main: .
    binary: lgty-action
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    # Reproducible builds: embed the tagged commit's timestamp, not the
    # wall-clock time the release job happened to run.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: lgty-action
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md

# One combined checksum file covering every released artifact — this is what
# gets signed (§2 of the LGT-37 spec), not each binary individually.
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# One SPDX-JSON SBOM per released archive, generated by syft from the built
# artifact (never hand-authored). `artifacts: archive` + the default args are
# GoReleaser's documented default for exactly this — SPDX JSON via syft.
sboms:
  - id: archive-sboms
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"

# Cosign keyless (OIDC/Sigstore) signing of the checksum file — not a stored
# key, per the repo's own "no long-lived secrets" law (CLAUDE.md law #3).
#
# NOTE / verified deviation from the LGT-37 spec's literal artifact names:
# the spec asks for `checksums.txt.pem` + `checksums.txt.sig` via
# `cosign sign-blob --yes`. Current cosign (v3.1.2, verified against the
# CLI's own --help/doc, not memory) has *removed* the separate
# --output-certificate/--output-signature flags that produced those two
# files — sign-blob now only supports the unified --bundle format. Rather
# than hand-parse the internal bundle JSON to fake the old two-file shape
# (fragile, undocumented schema, contrary to this repo's own
# "readable and auditable" ethos), this signs into a single
# `checksums.txt.bundle` file — cosign's own current recommended format,
# also what GoReleaser's own docs demonstrate. Flagged for security-c /
# the QA-security gate to confirm before LGT-39 closes.
signs:
  - id: checksums-sign
    cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - --bundle=${signature}
      - --yes
      - ${artifact}
    artifacts: checksum

release:
  github:
    owner: trulayer
    name: lgty-action
  prerelease: auto
